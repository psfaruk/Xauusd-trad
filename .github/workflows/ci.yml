# ════════════════════════════════════════════════════════════════════
# CI (audit §4.1) — the repo had NO pipeline: type errors, lint breaks
# and build regressions all shipped silently (that is exactly how
# ignoreBuildErrors stayed on for releases).
#
# Two domains, two jobs:
#   app          — the Next.js terminal (root project): tsc + lint + build
#   mt5-service  — mini-services/mt5-service, its own bun project with
#                  its own tsconfig (target ES2022) and lockfile
#
# NOTE on the app tsc gate: the root tsconfig.json EXCLUDES the sibling
# bun projects (mini-services, mt5-poc, scripts, skills, tool-results),
# so "bunx tsc --noEmit" covers the app domain only — the same scope
# next build enforces with typescript.ignoreBuildErrors=false.
# ════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── Next.js app (the terminal) ─────────────────────────
  app:
    name: app — typecheck / lint / build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # prisma generate + next build resolve the datasource at import
      # time (see Dockerfile) — point them at a throwaway file.
      # MT5_SKIP_SPAWN=1 keeps instrumentation.ts from trying to spawn
      # the mt5-service sidecar inside the build container.
      DATABASE_URL: file:/tmp/build.db
      MT5_SKIP_SPAWN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # 1.x line
          cache: true # bun install cache, keyed on bun.lock

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate
        # Deterministic: bun gates postinstall lifecycle scripts, so the
        # @prisma/client auto-generate may not run on a cold install —
        # without this step tsc cannot resolve @prisma/client types.

      - name: Type-check (app domain)
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build (standalone)
        run: |
          # fresh clone has no db/ (gitignored) — mirror the Dockerfile
          # so anything expecting the datasource parent dir finds it
          mkdir -p db
          bun run build

  # ───────────────────── mt5-service (market-data sidecar) ─────────────────────
  # Separate bun project (own package.json + bun.lock + tsconfig). It
  # type-checks clean today (verified locally: tsc --noEmit exit 0) —
  # keep it that way.
  mt5-service:
    name: mt5-service — typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mini-services/mt5-service
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install

      - name: Add bun-types (ephemeral dev dependency)
        run: bun add -d bun-types@1.3.6
        # The service tsconfig sets "types": ["bun-types"] but its
        # package.json doesn't list it — locally it resolves from the
        # ROOT node_modules of the monorepo checkout. In this job there
        # is no root install, so add it to the ephemeral checkout.
        # Pinned to the version the root project ships (bun-types 1.3.6).
        # Nothing is committed back to the repo.

      - name: Type-check
        run: bunx tsc --noEmit
