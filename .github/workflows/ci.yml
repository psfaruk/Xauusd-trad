# ════════════════════════════════════════════════════════════════════
# CI — production gate (audit §4.1 + Phase 0.2): install / lint /
# typecheck / prisma / build must ALL pass before anything ships.
# The repo previously had NO pipeline: type errors, lint breaks and
# build regressions all shipped silently (that is exactly how
# ignoreBuildErrors stayed on for releases).
#
# Two domains, two jobs:
#   gate        — the production gate for the Next.js terminal (root
#                 project): bun install → prisma generate → lint →
#                 tsc → fresh-SQLite `prisma db push` (validates the
#                 schema exactly the way the Dockerfile applies it) →
#                 `next build` against that throwaway DB.
#   mt5-service — mini-services/mt5-service, its own bun project with
#                 its own tsconfig (target ES2022) and lockfile
#
# NOTE on the app tsc gate: the root tsconfig.json EXCLUDES the sibling
# bun projects (mini-services, mt5-poc, scripts, skills, tool-results),
# so "bunx tsc --noEmit" covers the app domain only — the same scope
# next build enforces with typescript.ignoreBuildErrors=false.
# ════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────── production gate (Next.js app / the terminal) ─────────────────
  gate:
    name: gate — install / lint / typecheck / prisma / build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # keeps instrumentation.ts from trying to spawn the mt5-service
      # sidecar inside the build container (it early-returns on this).
      MT5_SKIP_SPAWN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # 1.x line — matches oven/bun:1.2-slim in the Dockerfile
          cache: true # bun install cache, keyed on bun.lock

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate
        # Deterministic: bun gates postinstall lifecycle scripts, so the
        # @prisma/client auto-generate may not run on a cold install —
        # without this step tsc cannot resolve @prisma/client types.

      - name: Lint
        run: bun run lint

      - name: Type-check (app domain)
        run: bunx tsc --noEmit

      - name: Apply schema to a fresh SQLite DB
        run: |
          # fresh clone has no db/ (gitignored) — mirror the Dockerfile
          # builder stage: create the parent dir, then push the schema to
          # a THROWAWAY database (never the dev one). --skip-generate:
          # the client was generated two steps ago.
          mkdir -p db
          DATABASE_URL=file:/tmp/ci.db bunx prisma db push --skip-generate

      - name: Build (standalone)
        run: DATABASE_URL=file:/tmp/ci.db bun run build
        # build script = next build + standalone copy (package.json).
        # DATABASE_URL is exported for the build: PrismaClient resolves
        # its datasource at import time, so the build would fail without
        # it (same as the Dockerfile builder stage).

  # ───────────────────── mt5-service (market-data sidecar) ─────────────────────
  # Separate bun project (own package.json + bun.lock + tsconfig). It
  # type-checks clean today (verified locally: tsc --noEmit exit 0) —
  # keep it that way.
  mt5-service:
    name: mt5-service — typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mini-services/mt5-service
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install

      - name: Add bun-types (ephemeral dev dependency)
        run: bun add -d bun-types@1.3.6
        # The service tsconfig sets "types": ["bun-types"] but its
        # package.json doesn't list it — locally it resolves from the
        # ROOT node_modules of the monorepo checkout. In this job there
        # is no root install, so add it to the ephemeral checkout.
        # Pinned to the version the root project ships (bun-types 1.3.6).
        # Nothing is committed back to the repo.

      - name: Type-check
        run: bunx tsc --noEmit
